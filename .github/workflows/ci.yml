name: CI

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging

jobs:
  ci:
    name: Format · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Code quality ────────────────────────────────────────────────────────

      - name: Check formatting (Biome)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      # ── Tests ────────────────────────────────────────────────────────────────
      # Runs all unit tests: portfolio recommendation logic + LLM utilities
      # (token estimation, guardrails, formatters, Zod schema).
      # No OpenAI API key is needed — tests cover pure functions only.

      - name: Run tests
        run: npm test

      # ── Production build ─────────────────────────────────────────────────────
      # Runs TypeScript type checking and the Next.js production build.
      # OPENAI_API_KEY is not required for the build; the API route is dynamic
      # and only executes at request time.

      - name: Build
        run: npm run build
        env:
          # Suppress Langfuse "no credentials" warnings during static generation
          LANGFUSE_SECRET_KEY: "ci-placeholder"
          LANGFUSE_PUBLIC_KEY: "ci-placeholder"
          LANGFUSE_HOST: "https://cloud.langfuse.com"

  # ── Changelog enforcement ─────────────────────────────────────────────────
  # On PRs that target main or develop, require CHANGELOG.md to be modified.
  # Chore / ci / style PRs may skip this by adding the label "skip-changelog"
  # to the pull request.
  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was modified
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          if git diff --name-only "$BASE" "$HEAD" | grep -q "^CHANGELOG.md$"; then
            echo "✓ CHANGELOG.md was updated in this PR."
            exit 0
          fi

          # Allow skip via PR label
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q "skip-changelog"; then
            echo "⚠ CHANGELOG.md not updated — skipped via 'skip-changelog' label."
            exit 0
          fi

          echo ""
          echo "✗ CHANGELOG.md was not updated in this PR."
          echo ""
          echo "  Every PR that adds a feature, fixes a bug, or changes user-facing"
          echo "  behaviour must include a CHANGELOG.md entry under [Unreleased]."
          echo ""
          echo "  If this PR is a pure chore/ci/style change, add the label"
          echo "  'skip-changelog' to the pull request to bypass this check."
          echo ""
          exit 1
